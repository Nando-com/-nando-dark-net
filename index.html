NÆNDO DÆRK NET — CYBER EDITION 2.0

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030805">
<title>NÆNDO DÆRK NET</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030805;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#07140c;padding:20px 12px;
 text-align:center;border-bottom:2px solid #00ff66;
}
header h1{color:#00ff66;margin:0;font-size:25px}
header p{color:#aaa;font-size:12px}
nav{
 display:flex;justify-content:center;gap:10px;
 flex-wrap:wrap;padding:15px;
 background:#050b07;
}
button{
 background:#00d957;color:#001b09;
 border:0;padding:11px 15px;
 border-radius:7px;font-weight:bold;
 cursor:pointer;
}
button:hover{background:#8affad}
input{
 width:90%;max-width:500px;
 padding:14px;border-radius:8px;
 border:1px solid #00ff66;
 background:#101a13;color:white;
 display:block;margin:15px auto;
}
h2{
 color:#00ff66;margin:25px 15px 15px;
}
#catalogo{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;padding:12px;
}
.card{
 background:#101a13;border:1px solid #164d2b;
 border-radius:10px;overflow:hidden;
}
.poster{
 height:155px;display:flex;
 justify-content:center;align-items:center;
 flex-direction:column;
 background:linear-gradient(140deg,#06371c,#020503);
 color:#00ff66;text-align:center;
 padding:10px;
}
.poster strong{font-size:23px}
.poster span{font-size:12px;color:white}
.info{padding:12px}
.info h3{margin:3px 0 8px;font-size:16px}
.info p{font-size:12px;color:#bbb;min-height:30px}
.info button{width:100%;font-size:12px}
.tag{
 color:#00ff66;font-size:11px;
 margin-bottom:8px;display:block;
}
footer{
 text-align:center;padding:25px;
 color:#888;font-size:12px;
 border-top:1px solid #164d2b;
}
@media(min-width:700px){
 #catalogo{grid-template-columns:repeat(4,1fr)}
 .poster{height:220px}
}
</style>
</head>

<body>

<header>
<h1>NÆNDO DÆRK NET</h1>
<p>CYBER EDITION 2.0 | ANIME & SERIES</p>
</header>

<nav>
<button onclick="filtrar('Todos')">INÍCIO</button>
<button onclick="filtrar('Anime')">ANIMES</button>
<button onclick="filtrar('Série')">SÉRIES</button>
</nav>

<input id="pesquisa"
placeholder="🔎 Pesquisar anime ou série..."
oninput="mostrar()">

<h2>🔥 CATÁLOGO</h2>
<div id="catalogo"></div>

<footer>
<p> NÆNDO DÆRK NET © 2026</p>
<p>Entretenimento digital | Fontes oficiais</p>
</footer>

<script>
const conteudos = [
{
 nome:"Naruto",
 tipo:"Anime",
 descricao:"Aventura, ninjas e amizade.",
 letra:"N",
 cor:"#163e23"
},
{
 nome:"One Piece",
 tipo:"Anime",
 descricao:"Uma grande aventura pelos mares.",
 letra:"OP",
 cor:"#17364a"
},
{
 nome:"Demon Slayer",
 tipo:"Anime",
 descricao:"Fantasia e aventura.",
 letra:"DS",
 cor:"#482323"
},
{
 nome:"Pokémon",
 tipo:"Anime",
 descricao:"Aventura no mundo Pokémon.",
 letra:"P",
 cor:"#584319"
},
{
 nome:"Stranger Things",
 tipo:"Série",
 descricao:"Mistério e aventura.",
 letra:"ST",
 cor:"#431b29"
},
{
 nome:"Wednesday",
 tipo:"Série",
 descricao:"Mistério e investigação.",
 letra:"W",
 cor:"#29233e"
}
];

let categoria="Todos";

function filtrar(tipo){
 categoria=tipo;
 mostrar();
}

function mostrar(){
 const termo=document.getElementById("pesquisa")
 .value.toLowerCase();

 const lista=conteudos.filter(item=>{
 return (categoria==="Todos" || item.tipo===categoria)
 && item.nome.toLowerCase().includes(termo);
 });

 document.getElementById("catalogo").innerHTML=
 lista.map(item=>`
 <div class="card">
 <div class="poster"
 style="background:linear-gradient(140deg,${item.cor},#020503)">
 <strong>${item.letra}</strong>
 <span>${item.nome}</span>
 </div>
 <div class="info">
 <span class="tag">${item.tipo}</span>
 <h3>${item.nome}</h3>
 <p>${item.descricao}</p>
 <button onclick="assistir('${encodeURIComponent(item.nome)}')">
 PROCURAR ONDE ASSISTIR
 </button>
 </div>
 </div>
 `).join("");

 if(!lista.length){
 document.getElementById("catalogo").innerHTML=
 "<p>Não foram encontrados resultados.</p>";
 }
}

function assistir(nome){
 const titulo=decodeURIComponent(nome);
 const url="https://www.google.com/search?q="+
 encodeURIComponent(titulo+" assistir dublado plataforma oficial");
 window.open(url,"_blank");
}

mostrar();
</script>

</body>
</html>
